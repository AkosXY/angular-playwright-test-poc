name: Playwright E2E Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run In-Memory E2E tests
        run: npx playwright test --project="In-Memory Tests"
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report/in-memory

      - name: Run Network Mock E2E tests
        run: npx playwright test --project="Network Mock Tests"
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report/network-mock

      - name: Create Index Page for Reports
        run: |
          mkdir -p playwright-report
          echo "<html><head><title>Playwright Test Reports</title></head><body style='font-family:sans-serif; padding:40px;'>" > playwright-report/index.html
          echo "<h1>Playwright E2E Test Execution Reports</h1><hr/><ul style='line-height:2; font-size:18px;'>" >> playwright-report/index.html
          echo "<li><a href='./in-memory/index.html'>In-Memory Test Report</a></li>" >> playwright-report/index.html
          echo "<li><a href='./network-mock/index.html'>Network Mock Test Report</a></li>" >> playwright-report/index.html
          echo "</ul></body></html>" >> playwright-report/index.html

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
